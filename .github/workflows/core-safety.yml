name: Core safety tests

on:
  pull_request:
    paths:
      - "iahash/db.py"
      - "start.sh"
      - "tests/test_registry_preservation.py"
      - ".github/workflows/core-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run persistence regression tests
        run: python -m pytest -q tests/test_registry_preservation.py
      - name: Shell syntax check
        run: sh -n start.sh
