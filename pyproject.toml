[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "iahash-reference"
version = "0.1.0"
description = "Offline ordered-pair certification and optional self-hosted reference service"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["cryptography==50.0.2"]

[project.optional-dependencies]
server = ["fastapi==0.143.0", "starlette==1.7.0", "pydantic==2.14.0", "uvicorn==0.54.0"]
client = ["httpx==0.28.1"]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["iahash_core*", "iahash_server*", "iahash_client*"]

[tool.pytest.ini_options]
testpaths = ["reference_tests"]

